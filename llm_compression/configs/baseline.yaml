# Baseline: no compression. Evaluates the uncompressed model.
model:
  id: meta-llama/Llama-3.2-1B
  load_dtype: float16
  inference_dtype: float16
  device: cuda
  trust_remote_code: false
  tokenizer:
    use_fast: true

compress:
  enabled: false

# calibration is unused when compress.enabled is false, but kept for ppl cache dir.
calibration:
  dataset: c4
  seq_len: 2048
  num_samples: 0
  batch_size: 1
  dataset_cache_dir: ./datasets
  data_cache_dir: ./data_cache

eval:
  perplexity:
    enabled: true
    dtype: float32        # perplexity in fp32 (fp16 log_softmax overflows -> inf ppl)
    datasets: [wikitext2, ptb, c4]
    contiguous: [ptb]       # whole-corpus contiguous protocol (paper-comparable)
    contiguous_split: test  # split used for contiguous datasets
    seq_len: 2048
    num_samples: 256        # sampled windows for non-contiguous datasets (wiki/c4)
    batch_size: 1
  reasoning:
    enabled: true
    dtype: float16        # reasoning in fp16
    tasks: [piqa, hellaswag, boolq, winogrande, arc_easy, arc_challenge, openbookqa]
    num_fewshot: 0
    batch_size: 8

seed: 0
results_path: ./outputs/baseline_results.json
