# SVD-LLM compression (data-aware whitened SVD, needs calibration + GPU).
model:
  id: meta-llama/Llama-3.2-1B
  load_dtype: float32        # compress in float32; cast to inference_dtype after
  inference_dtype: float16
  device: cuda
  trust_remote_code: false
  tokenizer:
    use_fast: true

compress:
  enabled: true
  strategy: svd_llm          # empty | svd | svd_llm | svd_llm_2 | coala | asvd
  ratio: 0.5                 # parameter-budget target in (0, 1]
  fp16: false                # adapter dtype (false => float32 adapters)
  adaptive_rank: false
  target_modules: [q_proj, k_proj, v_proj, o_proj, up_proj, gate_proj, down_proj]
  params:
    accumulate: 8            # TSQR streaming compaction (0 disables)
  save:
    enabled: false
    output_dir: ./outputs/compressed
    max_shard_size: 1GB
    save_ranks: true

calibration:
  dataset: c4                # wikitext2 | c4 | ptb
  seq_len: 2048
  num_samples: 256
  batch_size: 4
  dataset_cache_dir: ./datasets
  data_cache_dir: ./data_cache

eval:
  perplexity:
    enabled: true
    dtype: float32        # perplexity in fp32 (fp16 log_softmax overflows -> inf ppl)
    datasets: [wikitext2, ptb, c4]
    contiguous: [ptb]       # whole-corpus contiguous protocol (paper-comparable)
    contiguous_split: test  # split used for contiguous datasets
    seq_len: 2048
    num_samples: 128        # sampled windows for non-contiguous datasets (wiki/c4)
    batch_size: 1
  reasoning:
    enabled: true
    dtype: float16        # reasoning in fp16
    tasks: [piqa, hellaswag, boolq, winogrande, arc_easy, arc_challenge, openbookqa]
    num_fewshot: 0
    batch_size: 8

seed: 0
results_path: ./outputs/svd_llm_results.json
