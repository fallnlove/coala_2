[project]
name = "coala-pipeline"
version = "0.1.0"
description = "Unified LLM compression pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "transformers==4.48.3",
    "lm_eval==0.4.8",
    "peft==0.14.0",
    "datasets==3.3.0",
    "accelerate>=0.34,<1.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "huggingface-hub==0.30.2",
    "tokenizers==0.21.1",
    "scipy==1.15.2",
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
coala-pipeline = "pipeline.run:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA device",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["COALA", "Dobi-SVD", "vendor"]
